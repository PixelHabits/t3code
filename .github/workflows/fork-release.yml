name: Fork release

# Publishes the Linux x64 CLI archive and SHA256SUMS for a v<version>-fork.<n>
# tag, in the release layout that install.sh, `t3 service install` and
# `t3 update` read through T3CODE_RELEASE_BASE_URL.
on:
  push:
    tags:
      - "v*-fork.*"

permissions:
  contents: write

jobs:
  linux_x64:
    name: Linux x64 CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # T3 Connect's public Clerk and relay values, the ones app.t3.codes ships.
    # The build bakes them in and hides T3 Connect without them.
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
      T3CODE_CLERK_JWT_TEMPLATE: t3-relay
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
      T3CODE_RELAY_URL: https://relay.t3.codes
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Read version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Align package versions to the tag
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - name: Build server and web client
        run: vp run --filter t3 build

      - name: Apply web client branding
        run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      - name: Build CLI single-executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build resource monitor
        run: |
          vp run build:resource-monitor
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"

      # The Linux archive ships libatomic.so.1 and points t3's RUNPATH at it.
      - name: Install patchelf
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }

      - name: Build CLI archive
        run: >-
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$VERSION"
          --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-cli
        run: |
          sha256sum t3-*.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" t3-*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "T3 Code $VERSION" \
            --notes "Linux x64 CLI built from $GITHUB_SHA."
